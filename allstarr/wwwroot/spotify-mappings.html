<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Track Mappings - Allstarr</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --success: #3fb950;
            --warning: #d29922;
            --error: #f85149;
            --border: #30363d;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }
        
        .back-link {
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .back-link:hover {
            color: var(--accent-hover);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent);
        }
        
        .mappings-table {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .table-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        
        .table-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .filters {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .filter-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .search-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            flex: 1;
            max-width: 400px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .action-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .action-btn.danger:hover {
            border-color: var(--error);
            color: var(--error);
        }
        
        .actions-cell {
            display: flex;
            gap: 8px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: var(--bg-tertiary);
        }
        
        th {
            text-align: left;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }
        
        th.sortable {
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        
        th.sortable:hover {
            color: var(--accent);
        }
        
        td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        tbody tr:hover {
            background: var(--bg-tertiary);
        }
        
        .track-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .track-artwork {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            background: var(--bg-tertiary);
        }
        
        .track-details {
            flex: 1;
        }
        
        .track-title {
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .track-artist {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .badge.local {
            background: rgba(63, 185, 80, 0.2);
            color: var(--success);
        }
        
        .badge.external {
            background: rgba(88, 166, 255, 0.2);
            color: var(--accent);
        }
        
        .badge.manual {
            background: rgba(210, 153, 34, 0.2);
            color: var(--warning);
        }
        
        .badge.auto {
            background: rgba(139, 148, 158, 0.2);
            color: var(--text-secondary);
        }
        
        .mono {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 20px;
        }
        
        .pagination button {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .pagination button:hover:not(:disabled) {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination .page-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .error {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--error);
            border-radius: 8px;
            padding: 16px;
            margin: 20px 0;
            color: var(--error);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
    </style>
    <script src="/spotify-mappings.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Spotify Track Mappings</h1>
            <a href="/" class="back-link">
                ← Back to Dashboard
            </a>
        </header>
        
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Mappings</div>
                <div class="stat-value" id="stat-total">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Local Tracks</div>
                <div class="stat-value" id="stat-local">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">External Tracks</div>
                <div class="stat-value" id="stat-external">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Manual Mappings</div>
                <div class="stat-value" id="stat-manual">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Auto Mappings</div>
                <div class="stat-value" id="stat-auto">-</div>
            </div>
        </div>
        
        <div class="mappings-table">
            <div class="table-header">
                <h2>All Mappings</h2>
                <div class="table-controls">
                    <div class="filters">
                        <select class="filter-select" id="filter-type">
                            <option value="all">All Types</option>
                            <option value="local">Local Only</option>
                            <option value="external">External Only</option>
                        </select>
                        <select class="filter-select" id="filter-source">
                            <option value="all">All Sources</option>
                            <option value="manual">Manual Only</option>
                            <option value="auto">Auto Only</option>
                        </select>
                    </div>
                    <input type="text" class="search-box" placeholder="Search by title, artist, or Spotify ID..." id="search">
                </div>
            </div>
            
            <div id="content">
                <div class="loading">Loading mappings...</div>
            </div>
            
            <div class="pagination" id="pagination" style="display: none;">
                <button id="prev-btn">← Previous</button>
                <span class="page-info" id="page-info">Page 1 of 1</span>
                <button id="next-btn">Next →</button>
            </div>
        </div>
    </div>
</body>
</html>
