<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Allstarr</title>
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>
    <allstarr-app>
        <section class="signal-boot" aria-label="Loading Allstarr">
            <div class="signal-boot-grid" aria-hidden="true"></div>
            <div class="signal-boot-console">
                <div class="signal-boot-mark" aria-hidden="true">
                    <span class="signal-boot-orbit"></span>
                    <span class="signal-boot-pulse"></span>
                    <span class="signal-boot-core">A</span>
                </div>
                <p class="signal-boot-eyebrow">Allstarr signal boot</p>
                <h1>Bringing your music universe online</h1>
                <p class="signal-boot-status" aria-hidden="true">Tuning provider routes</p>
                <div class="signal-boot-meter" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                </div>
                <small>Providers · Library · Playback</small>
                <span class="signal-boot-accessible" role="status">Loading Allstarr. Preparing your music control center.</span>
            </div>
        </section>
    </allstarr-app>
    <script type="module" src="/js/webui.js"></script>
</body>

</html>
