# Optional Spotify lyrics sidecar.
# Usage: docker compose -f docker-compose.yml -f docker-compose.spotify-lyrics.yml up -d

services:
  spotify-lyrics:
    image: akashrchandran/spotify-lyrics-api@sha256:c95749ad939ba136893f16604e90e7f3f070beb2dea3aaa955646ec08330b4c6
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SP_DC: ${SPOTIFY_API_SESSION_COOKIE:-}
    networks:
      - allstarr
    security_opt:
      - no-new-privileges:true

  allstarr:
    environment:
      SpotifyApi__LyricsApiUrl: ${SPOTIFY_LYRICS_API_URL:-http://spotify-lyrics:8080}
