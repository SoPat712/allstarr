[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allstarr-apple-gateway"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "gamdl==3.8.2",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["apple_gateway*"]
