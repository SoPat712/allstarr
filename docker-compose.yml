name: allstarr

services:
  postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allstarr}
      POSTGRES_USER: ${POSTGRES_USER:-allstarr}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - allstarr
    security_opt:
      - no-new-privileges:true

  allstarr:
    image: ${ALLSTARR_IMAGE:-ghcr.io/sopat712/allstarr:3.1.0-beta.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:${PROXY_PORT:-5274}:8080"
      # The administration surface is loopback-only by default. Remote administration
      # requires BOTH ADMIN_BIND_ADDRESS=0.0.0.0 and ADMIN_BIND_ANY_IP=true; restrict it
      # further with ADMIN_TRUSTED_SUBNETS and a host firewall or reverse proxy.
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-5275}:5275"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Bootstrap and network security. Product, provider, account, matching, retention,
      # and feature settings are persisted through Allstarr's PostgreSQL settings store.
      Admin__BindAnyIp: ${ADMIN_BIND_ANY_IP:-false}
      Admin__TrustedSubnets: ${ADMIN_TRUSTED_SUBNETS:-}
      Admin__RedactSensitiveValues: ${ADMIN_REDACT_SENSITIVE_VALUES:-false}
      Admin__Containerized: "true"
      Admin__ContainerGateway: auto
      CORS__ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS__ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-}
      CORS__ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-}
      CORS__ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}

      Storage__Provider: Postgres
      Storage__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-allstarr};Username=${POSTGRES_USER:-allstarr};Include Error Detail=false
      Storage__PasswordFile: /run/secrets/postgres_password
      Storage__AutoMigrate: ${STORAGE_AUTO_MIGRATE:-true}
      Storage__BackupDirectory: /app/state/backups
      Storage__EnforceMutationGuard: "true"
      Secrets__KeyRingPath: /run/secrets/allstarr_keyring
      Readiness__RequireSecretKeyRing: "true"
      Readiness__RequiredDirectories__0: /app/state
      Readiness__RequiredDirectories__1: /app/downloads
      Readiness__RequiredDirectories__2: /app/kept

      Library__DownloadPath: /app/downloads
      Library__KeptPath: /app/kept
      Extensions__Directory: /app/state/extensions
      Extensions__AllowRemoteInstall: ${EXTENSIONS_ALLOW_REMOTE_INSTALL:-true}
      Admin__SessionStorePath: /app/state/admin-sessions.protected
      Diagnostics__EndpointUsageDirectory: /app/state/endpoint-usage

      AppleDownload__SetupUploadDirectory: /app/apple-upload
    secrets:
      - postgres_password
      - allstarr_keyring
    volumes:
      - allstarr-state:/app/state
      - allstarr-cache:/app/cache
      - ${DOWNLOAD_PATH:-./downloads}:/app/downloads
      - ${KEPT_PATH:-./kept}:/app/kept
      - ${APPLE_UPLOAD_PATH:-./.apple-provider/incoming}:/app/apple-upload
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 45s
    networks:
      - allstarr
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres-password.txt}
  allstarr_keyring:
    file: ${ALLSTARR_KEYRING_FILE:-./secrets/allstarr-keyring.json}

volumes:
  postgres-data:
  allstarr-state:
  allstarr-cache:

networks:
  allstarr:
    driver: bridge
